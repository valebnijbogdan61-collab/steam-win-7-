name: Build Steam.exe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW (32-bit)
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-mingw-w64-i686

      - name: Build
        run: |
          mkdir -p build
          i686-w64-mingw32-windres resources/steam.rc -O coff -o build/steam_res.o
          i686-w64-mingw32-g++ -std=c++11 -O2 -Wall -mwindows \
            -static -static-libgcc -static-libstdc++ \
            -DUNICODE -D_UNICODE -DWINVER=0x0601 -D_WIN32_WINNT=0x0601 -Isrc \
            src/*.cpp build/steam_res.o \
           -o build/Steam.exe -lgdi32 -lcomctl32 -lcomdlg32 -lshell32 -lole32 -loleaut32 -luuid -lgdiplus -lwinhttp -lmsimg32

      - name: Copy config.ini
        run: cp config.ini build/config.ini

      - uses: actions/upload-artifact@v4
        with:
          name: Steam-Win7
          path: |
            build/Steam.exe
            build/config.ini
